services:
  db:
    image: postgres:17
    container_name: legacy_db
    environment:
      POSTGRES_DB: legacy_payments
      POSTGRES_USER: legacy_user
      POSTGRES_PASSWORD: legacy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seeder.sql:/docker-entrypoint-initdb.d/02-seeder.sql:ro

  cobol:
    image: ubuntu:24.04
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "apt-get update -qq && apt-get install -y gnucobol && cobc -x legacy.cbl && ./legacy"

volumes:
  postgres_data: